# NOT run by default. The rest of .github/workflows/ci.yml, as Kiln steps, for when the owner has set
# the secret with `kiln secret set DOTNETLIB_PACKAGES_TOKEN` (a read:packages token for the dotnetlib
# feed). Kiln cannot run the WPF tests on Linux (no WindowsDesktop runtime), so Test is not here.
# Not verified: no token was available when this was written.
name: CI (needs the dotnetlib token)

on:
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  EnableWindowsTargeting: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/dotnet/sdk:10.0
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Restore
        run: dotnet restore tests/MicForge.Tests/MicForge.Tests.csproj
        env:
          NuGetPackageSourceCredentials_dotnetlib: Username=lukr-99;Password=${{ secrets.DOTNETLIB_PACKAGES_TOKEN }}

      - name: Check formatting
        run: |
          dotnet format MicForge.csproj --verify-no-changes --no-restore
          dotnet format tests/MicForge.Tests/MicForge.Tests.csproj --verify-no-changes --no-restore

      - name: Build
        run: dotnet build tests/MicForge.Tests/MicForge.Tests.csproj -c Release --no-restore -warnaserror
