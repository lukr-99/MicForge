name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_PROJECT: MicForge.csproj
  TEST_PROJECT: tests/MicForge.Tests/MicForge.Tests.csproj
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'nuget.config') }}
          restore-keys: nuget-${{ runner.os }}-

      # The test project references MicForge.csproj, so this restores and builds both.
      - name: Restore
        run: dotnet restore $env:TEST_PROJECT
        env:
          # DotNetLib packages come from GitHub Packages, which needs a token even to read. The secret
          # is a classic PAT with read:packages, the same one Startup Profiles uses (see nuget.config).
          # Only this step gets it.
          NuGetPackageSourceCredentials_dotnetlib: Username=lukr-99;Password=${{ secrets.DOTNETLIB_PACKAGES_TOKEN }}

      # dotnet format checks one project at a time (it skips referenced projects), so check both.
      # To fix a failure locally, run the same command without --verify-no-changes.
      - name: Check formatting (app)
        run: dotnet format $env:APP_PROJECT --verify-no-changes --no-restore

      - name: Check formatting (tests)
        run: dotnet format $env:TEST_PROJECT --verify-no-changes --no-restore

      - name: Build
        run: dotnet build $env:TEST_PROJECT -c Release --no-restore -warnaserror

      - name: Test
        run: >-
          dotnet test $env:TEST_PROJECT -c Release --no-build
          --logger "trx;LogFilePrefix=tests"
          --results-directory TestResults

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: warn
